<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Celestial Fury - Selección de Personajes</title>
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="character-selection-page">

<div class="container">
    <header class="header">
        <h1 class="title">♡ CELESTIAL FURY ♡</h1>
        <p class="subtitle">Selecciona a tu personaje favorito</p>
    </header>

    <main class="main-content">
        <div class="character-selection">
            <!-- BOMBÓN - Rosa -->
            <div class="character-card" data-character="bombon">
                <div class="character-visual">
                    <div class="character-icon" style="background-color: #FFB6E1;">🌸</div>
                </div>
                <div class="character-info">
                    <h3 class="character-name">Bombón</h3>
                    <p class="character-desc">Fuerte y Valiente</p>
                </div>
                <div class="selection-indicator"></div>
            </div>

            <!-- BURBUJA - Azul -->
            <div class="character-card" data-character="burbuja">
                <div class="character-visual">
                    <div class="character-icon" style="background-color: #ADD8E6;">💧</div>
                </div>
                <div class="character-info">
                    <h3 class="character-name">Burbuja</h3>
                    <p class="character-desc">Rápida e Inteligente</p>
                </div>
                <div class="selection-indicator"></div>
            </div>

            <!-- BELLOTA - Verde -->
            <div class="character-card" data-character="bellota">
                <div class="character-visual">
                    <div class="character-icon" style="background-color: #90EE90;">🍃</div>
                </div>
                <div class="character-info">
                    <h3 class="character-name">Bellota</h3>
                    <p class="character-desc">Ágil y Astuta</p>
                </div>
                <div class="selection-indicator"></div>
            </div>

            <!-- BRISA - Lila -->
            <div class="character-card" data-character="brisa">
                <div class="character-visual">
                    <div class="character-icon" style="background-color: #DDA0DD;">🌪️</div>
                </div>
                <div class="character-info">
                    <h3 class="character-name">Brisa</h3>
                    <p class="character-desc">Mística y Poderosa</p>
                </div>
                <div class="selection-indicator"></div>
            </div>
        </div>

        <!-- Panel de Resumen -->
        <div class="summary-panel">
            <h2>Personajes Seleccionados</h2>
            <div id="selected-count" class="selected-count">0 / 2</div>
            <div id="selected-characters" class="selected-list"></div>
            <button id="start-button" class="start-button" disabled>
                ¡COMENZAR BATALLA!
            </button>
        </div>
    </main>

    <footer class="footer">
        <p>Las Chicas Superpoderosas</p>
    </footer>
</div>

<script src="js/constants.js"></script>
<script src="js/utils.js"></script>
<script src="js/socketClient.js"></script>
<script src="js/characterManager.js"></script>
<script src="js/app.js"></script>
</body>
</html>
